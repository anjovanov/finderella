# Runs the storage gateway's tests on every OS/CPU it supports, plus a smoke test that drives
# every ffmpeg command the gateway builds through the real binaries (src/platform.smoke.test.ts):
# once with the ffmpeg the gateway would pick on that runner, once forced to the bundled builds.
# release.yml also runs it (workflow_call) before publishing a release.
name: Storage gateway platforms

on:
  workflow_call:
  push:
    branches: [main]
    paths: ['packages/**', 'package-lock.json', '.github/workflows/gateway-platforms.yml']
  pull_request:
    paths: ['packages/**', 'package-lock.json', '.github/workflows/gateway-platforms.yml']

permissions:
  contents: read

jobs:
  gateway:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-26 = macOS 26 on Apple Silicon, xcode-27 = macOS 27 on Apple Silicon
        # (GitHub's public-preview image, named after its Xcode 27 beta),
        # macos-15-intel = macOS 15 on Intel.
        os: [ubuntu-latest, windows-latest, macos-26, xcode-27, macos-15-intel]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npx vitest run packages/storage-gateway
      - name: Smoke test (resolved ffmpeg)
        run: npx vitest run packages/storage-gateway/src/platform.smoke.test.ts
        env:
          FINDERELLA_SMOKE: '1'
      - name: Smoke test (bundled ffmpeg)
        run: npx vitest run packages/storage-gateway/src/platform.smoke.test.ts
        env:
          FINDERELLA_SMOKE: '1'
          FINDERELLA_SMOKE_BUNDLED: '1'
      - name: Build CLI
        run: npm run build --workspace @finderella/storage-gateway
      - name: CLI starts
        run: node packages/storage-gateway/dist/cli.js --version

  # GitHub has no Fedora or Arch runners, so these run in the distros' official containers on
  # the Ubuntu runner (same kernel, real userland and real distro ffmpeg packages). They prove the
  # ffmpeg selection: Fedora's stock ffmpeg-free has no libx264 and must lose to the bundled
  # build; Arch's full ffmpeg must win.
  distros:
    name: ${{ matrix.distro }} (container) / node 24
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: fedora:latest
            packages: dnf install -y git tar xz gzip ffmpeg-free
            expect: bundled
          - distro: arch
            image: archlinux:latest
            packages: pacman -Syu --noconfirm --needed git tar xz gzip ffmpeg
            expect: system
    steps:
      - name: Install distro packages
        run: ${{ matrix.packages }}
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npx vitest run packages/storage-gateway
      - name: Smoke test (distro ffmpeg selection)
        run: npx vitest run packages/storage-gateway/src/platform.smoke.test.ts
        env:
          FINDERELLA_SMOKE: '1'
          FINDERELLA_SMOKE_EXPECT_FFMPEG: ${{ matrix.expect }}
          # No /dev/dri in the container: GPU detection must come back empty, not fail.
          FINDERELLA_SMOKE_EXPECT_HW: none
      - name: Smoke test (bundled ffmpeg)
        run: npx vitest run packages/storage-gateway/src/platform.smoke.test.ts
        env:
          FINDERELLA_SMOKE: '1'
          FINDERELLA_SMOKE_BUNDLED: '1'
