# Builds the media-agent CLI and attaches its installable tarball to the
# GitHub Release whenever a version tag is pushed:
#
#   git tag v0.0.1 && git push origin v0.0.1
#
# Users then install the agent on any device with:
#   npm install -g https://github.com/<owner>/<repo>/releases/download/v0.0.1/finderella-storage-gateway-0.0.1.tgz
name: Release agent

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build --workspace @finderella/storage-gateway
      - run: npm pack --workspace @finderella/storage-gateway --pack-destination release-out
      - uses: softprops/action-gh-release@v2
        with:
          files: release-out/*.tgz
          generate_release_notes: true
